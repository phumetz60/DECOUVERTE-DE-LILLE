<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rallye de Lille - Accès Énigme 28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --cream: #f5efe2;
    --aged: #e8dcc8;
    --sepia: #8b6914;
    --rust: #9c3b1a;
    --shadow: rgba(26,18,8,0.3);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #1e160a;
    background-image: radial-gradient(#2a1f0e 1px, transparent 1px);
    background-size: 20px 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem 1.5rem;
    font-family: 'Crimson Pro', Georgia, serif;
  }
  .wrapper {
    max-width: 600px;
    width: 100%;
    box-shadow: 0 30px 60px var(--shadow);
    background: var(--cream);
    background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
    border: 5px double var(--sepia);
    padding: 4rem 2rem;
    text-align: center;
    position: relative;
  }
  .badge {
    display: inline-block;
    background: var(--rust);
    color: var(--cream);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding: 0.6em 2em;
    margin-bottom: 2rem;
    border: 1px solid var(--ink);
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    color: var(--ink);
    margin-bottom: 1.5rem;
  }
  p {
    font-size: 1.2rem;
    color: var(--ink);
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }
  .final-btn {
    display: inline-block;
    padding: 1.2rem 2.5rem;
    background: var(--rust);
    color: var(--cream);
    text-decoration: none;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border: 2px solid var(--sepia);
    box-shadow: 5px 5px 0px var(--shadow);
  }
  .ornament { opacity: 0.3; margin-top: 2rem; }
</style>
</head>
<body>

<div class="wrapper">
  <div class="badge">Rallye de Lille</div>
  
  <h1>Énigme N°28</h1>
  
  <p>Pour accéder aux instructions et tester votre mot de passe, cliquez sur le bouton ci-dessous :</p>
  
  <a href="https://htmlpreview.github.io/?https://github.com/phumetz60/DECOUVERTE-DE-LILLE/blob/main/ENIGME%2028.html" 
     target="_blank" 
     rel="noopener noreferrer" 
     class="final-btn">
    Lancer l'Énigme
  </a>

  <div class="ornament">
    <svg width="100" height="30" viewBox="0 0 100 30">
      <path d="M0 15 Q25 0 50 15 T100 15" fill="none" stroke="#8b6914" stroke-width="2"/>
    </svg>
  </div>
</div>

</body>
</html>
